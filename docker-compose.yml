services:
  librechat:
    image: 'ghcr.io/danny-avila/librechat-dev-api:latest'
    environment:
      - SERVICE_URL_LIBRECHAT_3080
      - 'DOMAIN_CLIENT=${SERVICE_URL_LIBRECHAT}'
      - 'DOMAIN_SERVER=${SERVICE_URL_LIBRECHAT}'
      - HOST=0.0.0.0
      - PORT=3080
      - 'MONGO_URI=mongodb://127.0.0.1:27017/LibreChat'
      - 'MEILI_HOST=http://meilisearch:7700'
      - 'MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}'
      - RAG_PORT=8000
      - 'RAG_API_URL=http://rag-api:8000'
      - 'JWT_SECRET=${SERVICE_PASSWORD_JWT}'
      - 'JWT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWT}'
      - 'APP_TITLE=${APP_TITLE:-LibreChat}'
      - 'ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}'
      - 'ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}'
      - 'ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}'
      - 'ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}'
      - 'ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}'
      - 'ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}'
      - 'CREDS_KEY=${SERVICE_PASSWORD_64_CREDS}'
      - 'CREDS_IV=${SERVICE_PASSWORD_CREDS}'
      - 'ANTHROPIC_API_KEY=${SERVICE_ANTHROPIC_API_KEY:-user_provided}'
      - 'GOOGLE_KEY=${SERVICE_GOOGLE_API_KEY:-user_provided}'
      - 'OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}'
      - 'ASSISTANTS_API_KEY=${SERVICE_ASSISTANTS_API_KEY:-user_provided}'
      - 'DEBUG_LOGGING=${DEBUG_LOGGING:-false}'
      - 'DEBUG_OPENAI=${DEBUG_OPENAI:-false}'
      - 'DEBUG_PLUGINS=${DEBUG_OPENAI:-false}'
      - 'NO_INDEX=${NO_INDEX:-true}'
      - 'LOGIN_MAX=${LOGIN_MAX:-60}'
      - 'LOGIN_WINDOW=${LOGIN_WINDOW:-15}'
    volumes:
      - 'librechat-images:/app/client/public/images'
      - 'librechat-logs:/app/api/logs'
      - 'librechat-uploads:/app/uploads'
      - ./assets/logo.svg:/app/client/dist/assets/logo.svg
      - ./assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png
      - ./assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./assets
        target: /custom-assets
    ports:
      - '3080:3080'
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      rag-api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3080/api/auth/session']
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
  mongodb:
    image: 'mongo:8'
    environment:
      - 'MONGO_INITDB_ROOT_USERNAME=${SERVICE_USER_MONGO}'
      - 'MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}'
    volumes:
      - 'mongodb-data:/data/db'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
  meilisearch:
    image: 'getmeili/meilisearch:v1.12.3'
    environment:
      - 'MEILI_MASTER_KEY=${SERVICE_PASSWORD_MEILI}'
      - 'MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-false}'
      - MEILI_ENV=production
      - 'MEILI_HOST=http://meilisearch:7700'
    volumes:
      - 'meilisearch-data:/meili_data'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 20s
  vectordb:
    image: 'ankane/pgvector:latest'
    environment:
      - POSTGRES_DB=rag
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - 'vectordb-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SERVICE_USER_POSTGRES} -d rag']
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s
  rag-api:
    image: 'ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest'
    environment:
      - POSTGRES_DB=rag
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - DB_HOST=vectordb
      - 'DB_USER=${SERVICE_USER_POSTGRES}'
      - 'DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - DB_NAME=rag
      - RAG_PORT=8000
      - 'RAG_OPENAI_API_KEY=${SERVICE_OPENAI_API_KEY:-user_provided}'
    depends_on:
      vectordb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
  mcp-clickhouse-local:
    profiles:
      - mcp
    image: 'python:3.11-slim'
    command: "sh -c \" apt-get update && apt-get install -y curl wget && pip install --no-cache-dir uv && uv pip install --system mcp-clickhouse && mcp-clickhouse \"\n"
    environment:
      - CLICKHOUSE_HOST=host.docker.internal
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - 'CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}'
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=sse
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - CLICKHOUSE_MCP_BIND_PORT=8000
      - CLICKHOUSE_MCP_AUTH_disable=true
    ports:
      - '8002:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      disable: true
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
  mcp-clickhouse-tpch:
    profiles:
      - mcp
    image: 'python:3.11-slim'
    command: "sh -c \" apt-get update && apt-get install -y curl wget && pip install --no-cache-dir uv && uv pip install --system mcp-clickhouse && mcp-clickhouse \"\n"
    environment:
      - CLICKHOUSE_HOST=host.docker.internal
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=tpch_reader
      - 'CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}'
      - CLICKHOUSE_DATABASE=tpch
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=sse
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - CLICKHOUSE_MCP_BIND_PORT=8000
      - CLICKHOUSE_MCP_AUTH_disable=true
    ports:
      - '8003:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      disable: true
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
  mcp-clickhouse-analytical:
    profiles:
      - mcp
    image: 'python:3.11-slim'
    command: "sh -c \" apt-get update && apt-get install -y curl wget && pip install --no-cache-dir uv && uv pip install --system mcp-clickhouse && mcp-clickhouse \"\n"
    environment:
      - CLICKHOUSE_HOST=host.docker.internal
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=mars_inventory
      - 'CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}'
      - CLICKHOUSE_DATABASE=mars_inventory
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_MCP_SERVER_TRANSPORT=sse
      - CLICKHOUSE_MCP_BIND_HOST=0.0.0.0
      - CLICKHOUSE_MCP_BIND_PORT=8000
      - CLICKHOUSE_MCP_AUTH_disable=true
    ports:
      - '8004:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      disable: true
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
  sandpack:
    image: 'ghcr.io/librechat-ai/codesandbox-client/bundler:latest'
    container_name: sandpack-bundler
    restart: always
volumes:
  librechat-images: null
  librechat-logs: null
  librechat-uploads: null
  mongodb-data: null
  meilisearch-data: null
  vectordb-data: null
